[package]
name = "vibrato_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3.102"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
vibrato = "0.5.2"
wasm-bindgen = "0.2"
